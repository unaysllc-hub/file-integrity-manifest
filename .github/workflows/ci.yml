name: C# CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/FileIntegrityManifest.csproj --configuration Release
      - name: Verify create and clean check
        run: |
          mkdir -p fixture/nested
          printf 'alpha\n' > fixture/a.txt
          printf 'beta\n' > fixture/nested/b.txt
          dotnet run --project src -- create fixture manifest.json
          dotnet run --project src -- verify fixture manifest.json
      - name: Verify changes return a failure code
        run: |
          printf 'changed\n' > fixture/a.txt
          if dotnet run --project src -- verify fixture manifest.json; then
            echo "Expected verification to fail after changing a file"
            exit 1
          fi
